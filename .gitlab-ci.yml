stages:
  - test
  - build_testing
  # - build_beta
# manual_only_build_android_uat:
#   extends: .build_android_testing
#   only:
#     variables:
#       - $ENV =~ /uat/

manual_build_android_uat:
  extends: .build_android_testing
  only:
    - web
  except:
    variables:
      - $ENV == "auto"

manual_build_ios_uat:
  extends: .build_ios_testing
  only:
    - web
  except:
    variables:
      - $ENV == "auto"

.build_android_testing:
  tags:
    - flutter
  stage: build_testing
  variables:
    SECURE_FILES_DOWNLOAD_PATH: './android/app/'
  needs: []
  retry: 2
  script:
    - export LANG=en_US.UTF-8
    - export LANGUAGE=en_US.UTF-8
    - export LC_ALL=en_US.UTF-8
    - eval "$(/opt/homebrew/bin/brew shellenv)"
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - make clean
    - make build-apk
    - fastlane android publish_appcenter env:uat

.build_ios_testing:
  tags:
    - flutter
  stage: build_testing
  needs: []
  retry: 2
  script:
    - export LANG=en_US.UTF-8
    - export LANGUAGE=en_US.UTF-8
    - export LC_ALL=en_US.UTF-8
    - eval "$(/opt/homebrew/bin/brew shellenv)"
    - make clean
    - make build-ipa
    - fastlane ios publish_appcenter env:uat

test:
  tags:
    - flutter
  stage: test
  script:
    - make test
